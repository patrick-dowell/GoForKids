      visits: 4
      min_candidates: 10
      opening_moves: 2
      pass_threshold: 0.10
      clarity_prior: 1.1
      clarity_score_gap: 999.0
    # 18k/15k/12k: b28.yaml 9x9 knobs on the b20 net, policy_temp tuned to match the b28 rung
    # (measured on branch calib-b20-9x9; steps and checks in its data/calibration_logs_b20_9x9/: tuning_2026-10-02.txt,
    # visits_2026-10-03.txt, ladder_2026-10-03.txt).
    "18k":
      # tuned: policy_temp 3.5 -> 2.8 (tuning_2026-10-02.txt)
      # fewer visits (2026-10-03): visits 16 -> 8, policy_temp 2.8 -> 9.0, reading_rate 0.03 -> 0.12; holds against
      # the b28 twin at 8 visits (53.3% [48.9, 57.8], n=480; mistake mix vs live inside 0); see visits_2026-10-03.txt
      max_point_loss: 30.0
      mistake_freq: 0.8
      policy_weight: 0.12
      randomness: 0.78
      random_move_chance: 0.3
      local_bias: 0.0
      local_bias_in_opening: false
      local_bias_from_candidates: false
      reading_rate: 0.12
      policy_temp: 9.0
      wide_root_noise: 0.8
      first_line_chance: 0.0
      visits: 8
      min_candidates: 10
      opening_moves: 3
      # Human SL path (2026-10-04): with the human model loaded, this rung takes its moves from
      # KataGo's human net at its weakest profile and, from move 13 on, leans toward the weaker of
      # that net's candidates. The knobs above then apply only when the human model is not
      # loaded.
      human_sl_profile: rank_20k
      human_tilt: 8.0
      human_tilt_from: 12
      human_cand_min: 0.03
      human_cand_max: 8
      human_score_visits: 4
      # pass when no candidate gains human_pass_margin points over passing. A gain under
      # human_small_gain is inside the 4-visit reading's noise (a pointless move in a settled
      # position can read 1 to 2 points over a pass), so the best candidate and a pass are read
      # again at human_confirm_visits and that candidate is played only if it still gains
      # human_confirm_margin: the last one-point endgame moves get played, pointless ones do not.
      # never pick a candidate that loses more than the cap against the best one
      human_pass_margin: 0.5
      human_small_gain: 2.0
      human_confirm_visits: 12
      human_confirm_margin: 0.75
      human_loss_cap: 10.0
      pass_threshold: 0.1
      clarity_prior: 0.95
      clarity_score_gap: 25.0
    "15k":
      # tuned: policy_temp 2.6 -> 1.15 (tuning_2026-10-02.txt)
      # fewer visits (2026-10-03): visits 16 -> 8, policy_temp 1.15 -> 4.0, reading_rate 0.05 -> 0.25; holds against
      # the b28 twin at 8 visits (46.7% [42.2, 51.1], n=480; mistake mix vs live inside 0); see visits_2026-10-03.txt
      max_point_loss: 28.0
      mistake_freq: 0.75
      policy_weight: 0.12
      randomness: 0.78
      random_move_chance: 0.1
      local_bias: 0.0
      local_bias_in_opening: false
      local_bias_from_candidates: false
      reading_rate: 0.25
      policy_temp: 4.0
      wide_root_noise: 0.7
      sample_lapse: 0.45
      sample_loss_cap: 7.0
      first_line_chance: 0.0
      visits: 8
      min_candidates: 10
      opening_moves: 3
      # Human SL path (2026-10-04): with the human model loaded, this rung takes its moves from
      # the same human net profile as the 18k and, from move 13 on, leans toward the BETTER of
      # that net's candidates (a negative tilt). The knobs above then apply only when the human
      # model is not loaded. Candidates scored as the 18k's (4 visits, at most 8), so a move
      # costs the server the same. Measured on 9x9: the 18k as Black wins 31% at h1 (n=100) and
      # 53% at h2 (n=70), and loses 80% of even games (n=70).
      human_sl_profile: rank_20k
      human_tilt: -8.0
      human_tilt_from: 12
      human_cand_min: 0.03
      human_cand_max: 8
      human_score_visits: 4
      human_pass_margin: 0.5
      human_small_gain: 2.0
      human_confirm_visits: 12
      human_confirm_margin: 0.75
      human_loss_cap: 10.0
      pass_threshold: 0.1
      clarity_prior: 0.9
      clarity_score_gap: 18.0
    "12k":
      # tuned: policy_temp 2.45 -> 1.35; residual same-positions gap, see tuning_2026-10-02.txt
      max_point_loss: 27.0
      mistake_freq: 0.74
      policy_weight: 0.12
      randomness: 0.78
      random_move_chance: 0.08
      local_bias: 0.0
      local_bias_in_opening: false
      local_bias_from_candidates: false
      reading_rate: 0.072
      policy_temp: 1.35
      wide_root_noise: 0.7
      sample_lapse: 0.375
      sample_loss_cap: 6.5
      first_line_chance: 0.0
      visits: 16
      min_candidates: 10
      opening_moves: 3
      # Human SL path (2026-10-04): as the 15k, with a steeper lean toward the better candidates
      # (tilt -4) and a tighter cap (no candidate losing more than 4 points against the best),
      # so fewer large mistakes. The knobs above then apply only when the human model is not
      # loaded. Same server cost per move as the 18k. Measured on 9x9: the 15k as Black wins 41%
      # at h1 and 61% at h2, and loses 81% of even games; the 18k loses 97% of even games
      # (n=70 each).
      human_sl_profile: rank_20k
      human_tilt: -4.0
      human_tilt_from: 12
      human_cand_min: 0.03
      human_cand_max: 8
      human_score_visits: 4
      human_pass_margin: 0.5
      human_small_gain: 2.0
      human_confirm_visits: 12
      human_confirm_margin: 0.75
      human_loss_cap: 4.0
      pass_threshold: 0.1
      clarity_prior: 0.885
      clarity_score_gap: 16.5
