#
# This file is the source of truth from feature 20 (b28 calibration harness)
# onwards. The Python no longer hardcodes profile numbers — move_selector.py
# loads the file referenced by env var CALIBRATION_PROFILE_PATH, defaulting
# to data/profiles/b20.yaml.
#
# Lookup behavior matches the previous Python:
#   1. Look up (size, rank). If found, use it.
#   2. Otherwise fall back to the 19x19 profile for that rank.
#   3. Otherwise fall back to the 19x19 15k profile.
#
# Tuning notes that explain *why* each profile is what it is live in
# AI_CALIBRATION.md; the YAML stays terse on purpose so it's easy to
# edit-and-re-run during calibration.

