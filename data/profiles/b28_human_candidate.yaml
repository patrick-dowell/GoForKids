# b28_human_candidate.yaml: a CANDIDATE profile file, NOT loaded by the app.
#
# Nothing reads this file unless CALIBRATION_PROFILE_PATH names it: the backend's default is
# b20.yaml, and the web and iPad builds import b28.yaml only. (The backend image copies
# data/profiles/ whole, so the file rides along there, unused.)
#
# What it is: the device twins of the cloud 9x9 human-path rungs. Values are b28.yaml's (its comments
# and calibration history stay there), with the human SL block of b20.yaml's 9x9 18k, 15k, 12k, 9k and 6k
# added to the same five rungs here, so b28 is the main net that scores the human net's candidates
# and decides the pass. The old knobs of those rungs stay as the fallback (human model not loaded).
# The iPad cannot use these yet: the device has no human model.
#
# Measured on 9x9 against the b20 twins (same rank, b20 as the main net): even games, komi 6.5,
# 40 games a rung with colours split 20/20; "same strength" = the b20 twin scores 35-65%.

